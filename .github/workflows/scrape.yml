name: Scrape Tesla inventory

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Ensure database schema
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Scrape Tesla inventory
        run: pnpm --filter @autotrekker/scraper run scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
