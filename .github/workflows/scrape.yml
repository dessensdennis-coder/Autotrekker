name: Scrape Tesla inventory

# NOTE: Tesla's inventory API returns HTTP 403 for datacenter IPs (GitHub's
# runners included), so scraping from the cloud collects nothing. The scrape
# therefore runs LOCALLY from a residential IP (see README). This workflow is
# kept for manual use only (e.g. to (re)create the DB schema, or if you later
# route it through a residential proxy). The hourly schedule is intentionally
# disabled.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 * * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Ensure database schema
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Scrape Tesla inventory
        run: pnpm --filter @autotrekker/scraper run scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
